services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: clinicbook-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clinicbook;Username=clinicbook;Password=clinicbook_dev_password
      Redis__Connection: redis:6379,abortConnect=false
      Seq__ServerUrl: http://seq:5341
      Cors__AllowedOrigins: http://localhost:5173,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: clinicbook-web
    ports:
      - "8081:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: clinicbook-postgres
    environment:
      POSTGRES_DB: clinicbook
      POSTGRES_USER: clinicbook
      POSTGRES_PASSWORD: clinicbook_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicbook -d clinicbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinicbook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2024.3
    container_name: clinicbook-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: clinicbook-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  seq_data:
